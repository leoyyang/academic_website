# Languages
#   Create a section for each of your site's languages.
#   Documentation: https://wowchemy.com/docs/guide/language/

# Default language
en:
  languageCode: en-us
  # Uncomment for multi-lingual sites, and move English content into `en` sub-folder.
  contentDir: content/en
  params:
    description: "Leo Y. Yang at Hong Kong Baptist University. Research on digital political economy, AI, labor markets, and reproducible social science."
    plugins_js: [english]
    last_updated: '2026-09-05'
    marketing:
      seo:
        description: 'Leo Y. Yang at Hong Kong Baptist University. Research on digital political economy, AI, labor markets, and reproducible social science.'
        site_type: Person
    appearance:
      theme_day: minimal
      theme_night: dark
    header:
      on_scroll: fixed
      navbar:
        block: english-nav
    footer:
      copyright:
        notice: '© {year} Leo Y. Yang'
  menu:
    main:
      - {name: About, url: '/#about', weight: 10}
      - {name: Research, url: '/publication/', weight: 20}
      - {name: 'Software & Data', url: '/#software', weight: 30}
      - {name: 'Data Insights', url: '/#posts', weight: 40}
      - {name: Talks, url: '/#talks', weight: 50}
      - {name: CV, url: '/uploads/resume.pdf', weight: 60}

# Uncomment the lines below to configure your website in a second language.
